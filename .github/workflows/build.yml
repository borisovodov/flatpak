name: Build flatpaks

on:
  schedule:
    # Every four hours. The check is a single API call when nothing changed.
    - cron: '41 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for a new doru release
        id: check
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/borisovodov/doru/releases/latest | jq -r '.tag_name')
          version="${tag#v}"
          built=$(cat org.doru.doru/version.txt 2>/dev/null || echo none)
          echo "latest release: ${version}, last built: ${built}"
          if [ "${version}" = "${built}" ]; then
            echo "Up to date; nothing to build."
            exit 0
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout doru at the release tag
        uses: actions/checkout@v5
        with:
          repository: borisovodov/doru
          ref: ${{ needs.check.outputs.tag }}
          path: doru

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: doru/package-lock.json

      - name: Install flatpak tooling
        run: |
          sudo apt-get update -qq
          # appstream-util/appstream are not called anywhere, and their
          # recommends drag in the gstreamer/ffmpeg stack — a ~20 minute
          # download on the runner's apt mirror. --no-install-recommends
          # keeps that tree out (the named packages themselves remain).
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder ostree appstream-util appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Stamp the release version into the metainfo
        run: |
          python3 scripts/stamp-metainfo.py \
            doru/distribution/metadata/org.doru.doru.metainfo.xml \
            "${{ needs.check.outputs.version }}" "$(date -u +%Y-%m-%d)"


      - name: Build the app and the flatpak bundle
        working-directory: doru
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          # The llama-server engine ships via extraResources from
          # apps/desktop/build/llama/<platform>-<arch>; fetch it first, the
          # way the doru package scripts do. Without it the flatpak lacks
          # resources/llama/llama-server and Dóru AI chats fail with
          # "llama-server binary not found".
          node scripts/fetch-llama.ts
          cd apps/desktop
          npx electron-vite build
          npx electron-builder --linux flatpak --publish never

      - name: Smoke test the bundle on this architecture
        run: |
          mkdir -p /tmp/smoke-repo
          ostree --repo=/tmp/smoke-repo init --mode=archive
          flatpak build-import-bundle /tmp/smoke-repo doru/apps/desktop/release/*.flatpak
          flatpak remote-add --user --no-gpg-verify smoke "file:///tmp/smoke-repo"
          flatpak install --user -y smoke org.doru.doru//stable
          flatpak info org.doru.doru
          # The local-inference engine must be inside the bundle: list the
          # imported tree and fail loudly if resources/llama/llama-server
          # is absent (a build without fetch-llama.ts would otherwise break
          # silently until the first chat).
          REF=$(ostree --repo=/tmp/smoke-repo refs | grep '^app/org.doru.doru/' | head -1)
          ostree --repo=/tmp/smoke-repo ls -R "$REF" > /tmp/smoke-listing.txt
          if ! grep 'resources/llama/llama-server' /tmp/smoke-listing.txt; then
            echo "::error::llama-server missing from the flatpak bundle"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: doru/apps/desktop/release/*.flatpak
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          path: bundles

      - name: Install flatpak tooling
        run: |
          sudo apt-get update -qq
          # appstream-util/appstream are not called anywhere, and their
          # recommends drag in the gstreamer/ffmpeg stack — a ~20 minute
          # download on the runner's apt mirror. --no-install-recommends
          # keeps that tree out (the named packages themselves remain).
          sudo apt-get install -y -qq --no-install-recommends flatpak flatpak-builder ostree appstream-util appstream
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Import, sign, and smoke test the repository
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          printf '%s' "${FLATPAK_GPG_KEY}" | gpg --batch --import
          gpg --armor --export 2600902022BDB589 > pubkey.asc
          mkdir -p repo
          ostree --repo=repo init --mode=archive
          flatpak build-import-bundle --gpg-sign=2600902022BDB589 repo bundles/flatpak-x86_64/*.flatpak
          flatpak build-import-bundle --gpg-sign=2600902022BDB589 repo bundles/flatpak-arm64/*.flatpak
          flatpak build-update-repo --gpg-sign=2600902022BDB589 repo
          flatpak remote-add --user --gpg-import=pubkey.asc local "file://${PWD}/repo"
          flatpak install --user -y local org.doru.doru//stable
          flatpak info org.doru.doru

      - name: Publish the repository to the pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --orphan pages-worktree
          cd pages-worktree
          git switch -c pages
          git rm -rf -q . 2>/dev/null || true
          cp -a ../repo/. .
          cp ../borisovodov.flatpakrepo .
          git add -A
          git commit -q -m "Build org.doru.doru ${{ needs.check.outputs.version }}"
          git push -f origin pages
          cd ..
          git worktree remove pages-worktree

      - name: Record the built version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${{ needs.check.outputs.version }}" > org.doru.doru/version.txt
          git add org.doru.doru/version.txt
          git commit -q -m "org.doru.doru ${{ needs.check.outputs.version }}"
          git push
